$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/code-completion/0.1.0
source: main.rs
license: MIT
locale: en-US
id: cc_bank_account
title: Complete the BankAccount Rust Implementation
description: Fill in essential Rust keywords, operators, and method calls to declare structs, update mutable state, and validate transactions.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: code-completion
  difficulty: novice
  prereq_topics:
    - basic-syntax
    - variables
  topics:
    - structs
    - methods
    - borrowing
    - arithmetic
    - relational-operators
runtime:
  language: rust
statement: |
  Complete the `BankAccount` struct and method implementations in Rust by selecting the correct keywords, operators, and method identifiers.
  Make sure to:
  1. Declare the composite type using the Rust `struct` keyword.
  2. Correctly increment `self.balance` during a deposit.
  3. Ensure that withdrawal requests do not exceed the available balance.
  4. Invoke the proper transaction method on the mutable account binding in `main`.
executions:
  - title: Bob's Account
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    stderr: ''
    status: pass
elements:
  - type: blank
    location:
      context: struct BankAccount {
      snippet: struct
      nth: 1
    choices:
      - snippet: struct
        role: solution
        explanations:
          - body: |
              Correct! In Rust, the `struct` keyword is used to declare a user-defined record type containing named fields.
      - snippet: enum
        role: distractor
        explanations:
          - body: |
              Incorrect. In Rust, an `enum` defines a type with multiple distinct variants, rather than a single contiguous record structure.
      - snippet: trait
        role: distractor
        explanations:
          - body: |
              Incorrect. A `trait` defines shared behavior and method signatures, but does not declare concrete struct fields.
      - snippet: type
        role: distractor
        explanations:
          - body: |
              Incorrect. `type` defines a type alias in Rust (`type Name = ...`), not a new struct declaration.
  - type: blank
    location:
      context: self.balance += amount;
      snippet: +=
      nth: 1
    choices:
      - snippet: +=
        role: solution
        explanations:
          - body: |
              Correct! The compound addition operator (`+=`) increases `self.balance` by `amount`.
      - snippet: -=
        role: distractor
        explanations:
          - body: |
              Incorrect. The compound subtraction operator (`-=`) would deduct money from the account during a deposit instead of crediting it.
      - snippet: '*='
        role: distractor
        explanations:
          - body: |
              Incorrect. The compound multiplication operator (`*=`) would multiply the existing balance by the deposit amount, yielding an incorrect total.
      - snippet: '='
        role: distractor
        explanations:
          - body: |
              Incorrect. Using `=` overwrites the balance with `amount` rather than accumulating funds.
  - type: blank
    location:
      context: if 0 < amount && amount <= self.balance {
      snippet: <=
      nth: 1
    choices:
      - snippet: <=
        role: solution
        explanations:
          - body: |
              Correct! The less-than-or-equal operator (`<=`) ensures the user has sufficient funds, allowing withdrawals up to and including the exact total balance without overdrafting.
      - snippet: <
        role: distractor
        explanations:
          - body: |
              Incorrect. The strictly-less-than operator (`<`) would prevent account holders from withdrawing their exact entire balance (withdrawing down to zero).
      - snippet: '>='
        role: distractor
        explanations:
          - body: |
              Incorrect. Using `>=` would invert the business logic, permitting withdrawals only when the amount is greater than or equal to the balance, guaranteeing an overdraft.
      - snippet: '>'
        role: distractor
        explanations:
          - body: |
              Incorrect. Using `>` would only permit transactions that exceed the current balance, causing an immediate overdraft into negative funds.
  - type: blank
    location:
      context: account.deposit(100);
      snippet: deposit
      nth: 1
    choices:
      - snippet: deposit
        role: solution
        explanations:
          - body: |
              Correct! Invokes the `deposit` method on `account` with an argument of `100` to credit the account.
      - snippet: withdraw
        role: distractor
        explanations:
          - body: |
              Incorrect. Invoking `withdraw(100)` would debit the account instead of performing the required deposit transaction.
      - snippet: balance
        role: distractor
        explanations:
          - body: |
              Incorrect. `balance` is an `i32` field, not a callable method; calling `account.balance(100)` causes a Rust compilation error: `no method named balance found for struct BankAccount`.
