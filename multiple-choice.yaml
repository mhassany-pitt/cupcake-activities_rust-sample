question: |
  Given the following Rust struct definition:
  
  ```rust
  struct BankAccount {
      owner: String,
      balance: i32,
  }
  ```
  
  Which of the following represents the correct implementation for a `deposit` method in an `impl BankAccount` block that validates positive deposit amounts, modifies the instance balance, and returns the new balance?
choices:
  - body: |
      ```rust
      fn deposit(&mut self, amount: i32) -> i32 {
          if amount > 0 {
              self.balance += amount;
          }
          self.balance
      }
      ```
    role: solution
    include: always
    order: 1
    explanations:
      - body: |
          Correct! In Rust, mutating struct fields requires taking an exclusive mutable borrow (`&mut self`). This method verifies `amount > 0`, updates `self.balance` using `+=`, and implicitly returns the updated balance.
  - body: |
      ```rust
      fn deposit(&self, amount: i32) -> i32 {
          if amount > 0 {
              self.balance += amount;
          }
          self.balance
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. In Rust, taking an immutable borrow (`&self`) prevents mutating struct fields. Attempting `self.balance += amount` causes a compiler error: `cannot assign to data in a & reference`.
  - body: |
      ```rust
      fn deposit(&mut self, amount: i32) -> i32 {
          if amount > 0 {
              self.balance =+ amount;
          }
          self.balance
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. In Rust, `=+` is parsed as assigning positive `amount` (`self.balance = +amount`), which overwrites the balance rather than accumulating funds with `+=`.
  - body: |
      ```rust
      fn deposit(self, amount: i32) -> i32 {
          if amount > 0 {
              let mut balance = self.balance + amount;
              return balance;
          }
          self.balance
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. Taking `self` takes ownership by value (moves the struct). When the method completes, the `BankAccount` is dropped, rendering the caller's variable unusable in subsequent operations.
